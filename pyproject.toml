[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-ml"
version = "0.8.0"
description = "Local-first AI lecture screenshot extraction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psutil>=6.1,<8.0",
  "yt-dlp>=2025.1.15",
  "numpy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "scikit-image>=0.24,<1.0",
  "faster-whisper>=1.1,<2.0",
  "Pillow>=11,<13",
  "reportlab>=4.2,<5.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
vlm = [
  "torch>=2.4",
  "transformers>=4.57",
  "accelerate>=1.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
