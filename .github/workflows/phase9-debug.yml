name: Phase 9 backend diagnostics

on:
  push:
    branches: [phase9-work]
  workflow_dispatch:

jobs:
  backend-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Capture backend tests
        id: tests
        shell: bash
        run: |
          set +e
          pytest -vv --tb=short > pytest.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-backend-test-log
          path: pytest.log
      - name: Preserve test result
        shell: bash
        run: exit "${{ steps.tests.outputs.code }}"
