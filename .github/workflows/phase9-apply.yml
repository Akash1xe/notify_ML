name: Apply Phase 9 integration

on:
  push:
    branches: [phase9-work]
    paths:
      - '.github/workflows/phase9-apply.yml'
      - 'publish/apply_phase9.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release integration
        run: python publish/apply_phase9.py
      - name: Commit release integration
        run: |
          git config user.name 'Akash1xe'
          git config user.email '121711965+Akash1xe@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Apply Phase 9 release integration'
          git push origin HEAD:phase9-work
