name: Create Notify v1 tag

on:
  push:
    branches: [release-tag-v1]
    paths:
      - ".github/workflows/create-v1-tag.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact release commit
        run: test "$(git rev-parse HEAD)" = "f6db8f4e69f74856cc3b84cf54d4ebe5b4bb15d8"
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Revalidate exact release commit
        run: |
          python scripts/validate_release.py \
            --official \
            --output /tmp/notify-release
      - name: Ensure tag does not already exist
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 1
          fi
      - name: Create and push v1.0.0
        run: |
          git config user.name "Akash1xe"
          git config user.email "121711965+Akash1xe@users.noreply.github.com"
          git tag -a v1.0.0 -m "Notify v1.0.0"
          git push origin v1.0.0
