name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Run backend tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Validate evaluation dataset
        run: python scripts/validate_evaluation_dataset.py
      - name: Run benchmark smoke
        run: python scripts/run_benchmark.py --strict
      - name: Run quality baseline smoke
        run: python scripts/evaluate_quality_baseline.py --strict --output /tmp/notify-baseline.json
      - name: Run calibration dry run
        run: python scripts/run_calibration.py --dry-run > /tmp/notify-calibration.json
      - name: Run performance smoke
        run: python scripts/profile_pipeline.py --mode cache-hit --output /tmp/notify-performance.json > /tmp/notify-performance.log
      - name: Run stress smoke
        run: python scripts/run_stress_tests.py --tier ci > /tmp/notify-stress.json
      - name: Run reliability smoke
        run: python scripts/run_reliability_tests.py --tier ci > /tmp/notify-reliability.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
