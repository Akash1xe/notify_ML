name: Phase7 source export

on:
  push:
    branches: [phase7-work]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          tar --exclude=.git -czf /tmp/notify_source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: notify-source
          path: /tmp/notify_source.tar.gz
          if-no-files-found: error
